cntDescription=# MDPlayer\
Player for VGM files, etc. (A performance tool using emulation of Mega Drive sound chips, etc.)  \
  \
[Overview]  \
  This tool plays VGM files while displaying a keyboard.  \
  (Also supports NRD, XGM, S98, MID, RCP, NSF, HES, SID, MDR, MDX, MND, MUC (TBD), and MUB (TBD) files.)  \
  \
[Caution]  \
  \u30FBPlease be careful with the volume during playback. Noise due to bugs may be played at a high volume.  \
  (Especially when trying files you have never played before or when the program has been updated.)  \
  \
  \u30FBIf you find any problems during use, please contact us on Twitter (@kumakumakumaT_T).  \
  (Please do not contact the authors of VGMPlay, NRTDRV, or other wonderful software  \
  directly regarding MDPlayer.)  \
  I intend to respond as much as possible, but there are many cases where I cannot meet your requests. Please understand.  \
  \
[Supported Formats]  \
  .VGM (So-called vgm files)  \
  .VGZ (vgm file compressed with gzip)  \
  .NRD (Performance file for the driver that plays two OPMs and an AY8910 on NRTDRV X1)  \
  .XGM (Files for Mega Drive)  \
  .S98 (Files mainly for Japanese retro PCs)  \
  .MID (Standard MIDI file. Supports format 0/1)  \
  .RCP (Recopon file. CM6, GSD transmission possible)  \
  .NSF (NES Sound Format)  \
  .HES (HES files)  \
  .SID (Files for Commodore)  \
  .MDR (Performance file for the driver that plays MoonSound (OPL4) on MoonDriver MSX)  \
  .MDX (Files for MXDRV)  \
  .MND (Performance file for the driver using MNDRV X68000 (OPM, OKIM6258) & Mercury Unit (OPNAx2))  \
  .MUC (Files for MUCOM88Windows) TBD  \
  .MUB (Files for MUCOM88Windows) TBD  \
  .M3U (Playlist)  \
  \
[Functions and Features]  \
  \u30FBCurrently, playback via emulation of the following sound chips, mainly Mega Drive related, is possible.  \
     \
      AY8910    , YM2612   , SN76489 , RF5C164 , PWM     , C140(C219) , OKIM6295 , OKIM6258(incl. PCM8,MPCM)  \
      , SEGAPCM , YM2151   , YM2203  , YM2413  , YM2608  , YM2610/B   , HuC6280  , C352  \
      , K054539 , NES_APU  , NES_DMC , NES_FDS , MMC5    , FME7       , N160     , VRC6  \
      , VRC7    , MultiPCM , YMF262  , YMF271  , YMF278B , YMZ280B    , DMG      , QSound  \
      , S5B     , GA20  \
      , RF5C68  , SID      , Y8950   , YM3526  , YM3812  , K053260    , K051649(K052539)  \
  \
  \u30FBCurrently, the following keyboard displays are possible.  \
     \
      YM2612        , SN76489    , RF5C164  \
      , AY8910      , C140(C219) , C352    , SEGAPCM  \
      , Y8950       , YM2151     , YM2203  , YM2413  , YM2608 , YM2610/B , YM3526 , YM3812  \
      , YMF262      , YMF278B    \
      , HuC6280     , MIDI       \
      , NES_APU&DMC , NES_FDS    , MMC5    , VRC7    \
  \
  \u30FBCreated in C#.  \
  \
  \u30FBReferenced and ported from the source of VGMPlay, MAME, and DOSBOX.  \
  \
  \u30FBReferenced and ported from the source of FMGen.  \
  \
  \u30FBReferenced and ported from the source of NSFPlay.  \
  \
  \u30FBReferenced and ported from the source of NEZ Plug++.  \
  \
  \u30FBReferenced and ported from the source of libsidplayfp.  \
  \
  \u30FBReferenced and ported from the source of sidplayfp.  \
  \
  \u30FBReferenced and ported from the source of NRTDRV.  \
  \
  \u30FBReferenced and ported from the source of MoonDriver.  \
  \
  \u30FBReferenced and ported from the source of MXP.  \
  \
  \u30FBReferenced and ported from the source of MXDRV.  \
  \
  \u30FBReferenced and ported from the source of MNDRV.  \
  \
  \u30FBReferenced and ported from the source of X68Sound.  \
  (Both m_puusan and rururutan versions)  \
  \
  \u30FBReferenced and ported from the source of MUCOM88/MUCOM88windows.  \
  \
  \u30FBAdjusted to output the same data as CVS.EXE output.  \
  \
  \u30FBPlayback is possible from real YM2612, SN76489, YM2608, and YM2151 using SCCI.  \
  It also supports SPPCM.  \
  \u30FBButtons are arranged in the following order.  \
     \
     Settings, Stop, Pause, Fade out, Previous song, 1/4 speed playback, Play, 4x speed playback, Next song,  \
     Play mode, Open file, Playlist,  \
     Info panel display, Mixer panel display, Panel list display, VST effect settings, MIDI keyboard display, Change display magnification  \
  \
  \u30FBChannels (keyboards) can be masked by left-clicking.  \
    Right-clicking unmasks all channels.  \
    (Some levels are not supported.)  \
  \
  \u30FBLeft-clicking OPN, OPM, OPL tone parameters copies them to the clipboard as text.  \
  The parameter format can be changed in the option settings.  \
     \
      FMP7 , MDX , MUCOM88(MUSIC LALF) , NRTDRV , HuSIC , MML2VGM , .TFI , MGSC  \
  \
  are supported, and if .TFI is selected, it outputs to a file instead of the clipboard.  \
  \
  \u30FBAlthough the quality is still a work in progress, YM2612 and YM2151 performance data can be output as MIDI files.  \
  Using VOPMex, FM sound source tone information can also be reflected.  \
  (It's VOPMex, not VOPM. ;-P )  \
  \
  \u30FBPCM data can be dumped. Only SEGAPCM is output as WAV.  \
  \
  \u30FBPerformance can be exported as wav.  \
  \
  \u30FBVSTi can be specified for MIDI sound sources.  \
  \
  \u30FBOperations such as play and stop are possible from the keyboard or MIDI keyboard.  \
  \
  \u30FBFrom the playlist, you can open files with the same name but different extensions (Text, MML, Image) as the one being played.  \
  \
  \u30FBUnique features have been added to VGM/VGZ files.  \
      Dual performance of RF5C164  \
      Lyric display  \
  \
  \
[Required Operating Environment]  \
  \u30FBProbably Windows Vista (32bit) or later. I use Windows 10 Home (x64).  \
  Does not work on XP.  \
  \
  \u30FB.NET Framework 4.5/4.5.2 must be installed.  \
  \
  \u30FBVisual C++ Redistributable for Visual Studio 2012 Update 4 must be installed.  \
  \
  \u30FBMicrosoft Visual C++ 2015 Redistributable (x86) - 14.0.23026 must be installed.  \
  \
  \u30FBIf using LZH files, UNLHA32.DLL (Ver 3.0 or later) must be installed.  \
  \
  \u30FBAn audio device capable of playing sound is required.  \
  Something with decent performance is needed. The UCA222 that came with the UMX250 is sufficient. I use that.  \
  \
  \u30FBIf available, SPFM Light + YM2612 + YM2608 + YM2151 + SPPCM  \
  \
  \u30FBFor YM2608 emulation, the following audio files are required to play rhythm sounds.  \
  I apologize, but I will leave the creation method to you.  \
      \
      Bass Drum       2608_BD.WAV  \
      Hi-hat          2608_HH.WAV  \
      Rim shot        2608_RIM.WAV  \
      Snare drum      2608_SD.WAV  \
      Tom-tom         2608_TOM.WAV  \
      Top cymbal      2608_TOP.WAV  \
      (44.1KHz 16bit PCM Mono Uncompressed Microsoft WAVE format)  \
  \
  \u30FBFor YMF278B emulation, the following ROM file is required to play MoonSound tones.  \
  I apologize, but I will leave the creation method to you.  \
  	yrw801.rom  \
  \
  \u30FBFor C64 emulation, the following ROM files are required.  \
  I apologize, but I will leave the creation method to you.  \
  	Kernal , Basic , Character  \
  \
  \u30FBA reasonably fast CPU.  \
  The required processing power varies depending on the chip used.  \
  I use an i7-9700K 3.6GHz.  \
  \
  \
