[Guide to Synchronization]  \
      \
  \u30FBSynchronizing sound between SCCI and emulation (hereafter abbreviated as EMU) requires some tricks.  \
  Since it depends on the environment, I don't know what the correct answer is, but I will introduce the adjustment procedure in my environment.  \
      \
    1. First, select the device to be used for audio output from the [Output] tab.  \
    Recommended patterns are choosing Shared in WasapiOut or choosing ASIO.  \
      \
    2. Select a latency of 50ms or 100ms. Press [OK] once and play a song that uses only EMU to confirm  \
    that the sound is not grainy or mixed with clicking noise.  \
    (If it doesn't play cleanly, set the latency one step higher.)  \
      \
    3. Select the SCCI for YM2612 from the [Sound Source] tab and select the module to be used.  \
    Check the "Send Wait signal" and "Emulate only PCM" checkboxes.  \
    Sending the "Wait signal" seems to stabilize the SCCI tempo.  \
    However, checking "Double that Wait value" improves PCM sound quality but tends to disrupt the tempo.  \
      \
    4. For the delayed performance group, set both SCCI and EMU to 0ms for now and check "Opportunistic mode".  \
    "Opportunistic mode" is a function that adjusts the SCCI playback speed to reduce the gap if, for example,  \
    a heavy load occurs during performance and the SCCI and EMU playback drift significantly.  \
    However, it maintains the gap set (intended) in delayed performance.  \
      \
    5. Play a song where both SCCI and EMU are used and carefully check which one is playing first.  \
    Increase the delayed performance time of the one playing first among SCCI and EMU, play the song, and check.  \
      \
    6. Repeat step 5 until the gap disappears, and the synchronization work is complete. Enjoy!  \
  \
[Guide to MIDI Keyboards]  \
  \u30FBIf you prepare a MIDI keyboard, you can use it to produce sound from YM2612 (EMU).  \
  This function was prepared mainly to support MML input.  \
  (Currently, some functions cannot be used as they are in the middle of implementation.)  \
  \
  \u30FBHow to use for now  \
      \
    1. In the settings screen, select the MIDI keyboard to be used.  \
       \
    2. Send (CC:97) while playing YM2612 data.  \
        The tone of YM2612 1Ch will be set to all channels.  \
       \
    3. Then just play.  \
    \
  \u30FBMain functions  \
      \
    1. Tone data import  \
      Clicking the tone data part of each OPN or OPM sound source or keyboard display  \
      copies the tone data to the selected channel.  \
      \
    2. Performance mode switching  \
      You can switch between MONO mode (playing using a single channel) and  \
      POLY mode (playing using multiple channels (up to 6Ch)).  \
      MONO mode: Intended for playing short phrases during input and outputting as MML.  \
      POLY mode: Intended for use to check chords during input.  \
      \
    3. Channel note log  \
      You can keep a record of up to 100 notes for each channel.  \
      \
    4. Channel note log MML conversion function  \
      Clicking the log column copies the performance record to the clipboard as MML.  \
      Note length is not output. Supported commands are c d e f g a b o < >.  \
      Octave information is specified absolutely with the "o" command only for the first note,  \
      and thereafter expanded by relative specification with < and > commands.  \
      \
    5. Tone save/load  \
      You can save or load 256 types of tones in memory.  \
      That data can be output to or loaded from a file in a specified format.  \
      Can be saved/loaded in formats for the following software:  \
        FMP7  \
        MUCOM88(MUSIC LALF)  \
        NRTDRV  \
        MXDRV  \
        mml2vgm  \
      \
    6. Simple tone editing (TBD)  \
      Editing is possible by selecting the parameter you want to input and then entering a numerical value.  \
      \
  \u30FBScreen  \
      \
    0. Keyboard (TBD)  \
      Notes being played are displayed.  \
      \
    1. MONO  \
      Click to switch to MONO mode. When switched, it becomes a \u266A icon.  \
      \
    2. POLY  \
      Click to switch to POLY mode. When switched, it becomes a \u266A icon.  \
      \
    3. PANIC  \
      Sends key-off to all channels. (Used when sound keeps playing.)  \
      \
    4. L.CLS  \
      Clears the note log of all channels.  \
      \
    5. TP.PUT  \
      Saves the tone of the selected channel to the TonePallet (tone storage area in memory).  \
      \
    6. TP.GET  \
      Loads a tone from the TonePallet to the selected channel.  \
      \
    7. T.SAVE  \
      Saves the TonePallet to a file.  \
      \
    8. T.LOAD  \
      Loads the TonePallet from a file.  \
      \
    9. Tone data (for 6 channels)  \
      \u30FBYou can select or deselect a channel by clicking "-" or "\u266A".  \
      \u30FBYou can change a parameter by right-clicking it. (TBD)  \
      \u30FBLeft-clicking a parameter displays a context menu.  \
        Copy: Copies the clicked tone to the clipboard.  \
        Paste: Pastes the tone from the clipboard to the clicked tone.  \
        You can change the text format used in the above functions by clicking the software name in the FORMAT column.  \
        Copy and paste are also possible via key operations. In this case, the selected channel is the target.  \
        Note that automatic format detection is not performed during pasting.  \
      \u30FBClicking the "\u266A" next to "LOG" clears the note log for that channel.  \
      \u30FBClicking LOG sets the MML data to the clipboard.  \
      \
  \u30FBOperation from MIDI keyboard  \
    The following is for default settings. (Customizable in settings. Can be disabled by leaving the setting value blank.)  \
      \
    CC:97(DATA DEC)  \
      Copies the tone of YM2612 1Ch to all channels. (Ignores selection status)  \
      \
    CC:96(DATA INC)  \
      Deletes only the most recent log. (Function to cancel mistakes, etc.)  \
      \
    CC:66(SOSTENUTO)  \
      Only in MONO mode, converts the log of the selected row to MML and sets it to the clipboard.  \
      Difference from processing when clicking the screen:  \
        Sends Ctrl+V (paste) keystroke.  \
        Clears the note log of the selected channel.  \
        Does not output the first octave command.  \
      \
      \
